// pyro.cfg
exec _my_configs/reset.cfg

// Weapon Switching (Scroll Wheel)
// Mousewheel Up: Primary
// Mousewheel Down: Secondary
bind "MWHEELUP" "slot1"
bind "MWHEELDOWN" "slot2"

// The Panic Airblast (Mouse 2)
// Switch to primary and airblast
alias +panic_airblast "slot1; +attack2"
alias -panic_airblast "-attack2"
bind "MOUSE2" "+panic_airblast"

echo "==================================="
echo "        PYRO CONFIG LOADED         "
echo "==================================="

