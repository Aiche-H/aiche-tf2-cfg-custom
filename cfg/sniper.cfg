// ==========================================================
// SNIPER CONFIG
// ==========================================================
exec "_my_configs/reset.cfg"

// ----------------------------------------------------------
//  QUICK-THROW UTILITY (Jarate)
// ----------------------------------------------------------
// Switches to Slot 2, throws/attacks, and returns to previous weapon
alias +pissthrow       "slot2; +attack"
alias -pissthrow       "-attack; lastinv"

// ----------------------------------------------------------
//  SNIPER BINDS
// ----------------------------------------------------------
bind "SHIFT"           "+pissthrow"

echo "==================================="
echo "        SNIPER CONFIG LOADED       "
echo "==================================="

