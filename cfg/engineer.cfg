// ==========================================================
// ENGINEER CONFIG
// ==========================================================
exec "_my_configs/reset.cfg"

// ----------------------------------------------------------
//  BUILDING ALIASES
// ----------------------------------------------------------
alias "build_sentry"    "build 2 0"
alias "build_dispenser" "build 0 0"
alias "build_entrance"  "build 1 0"
alias "build_exit"      "build 1 1"

// ----------------------------------------------------------
//  DESTRUCTION ALIASES
// ----------------------------------------------------------
alias "dest_sentry"     "destroy 2 0"
alias "dest_dispenser"  "destroy 0 0"
alias "dest_entrance"   "destroy 1 0"
alias "dest_exit"       "destroy 1 1"

// ----------------------------------------------------------
//  MODIFIER LOGIC (Shift to Build / Alt to Destroy)
// ----------------------------------------------------------
alias +shift_build      "bind 1 build_sentry; bind 2 build_dispenser; bind 3 build_entrance; bind 4 build_exit"
alias -shift_build      "bind 1 slot1;        bind 2 slot2;           bind 3 slot3;          bind 4 slot4"

alias +alt_destroy      "bind 1 dest_sentry; bind 2 dest_dispenser; bind 3 dest_entrance; bind 4 dest_exit"
alias -alt_destroy      "bind 1 slot1;        bind 2 slot2;           bind 3 slot3;          bind 4 slot4"

// ----------------------------------------------------------
//  ENGINEER BINDS
// ----------------------------------------------------------
bind "SHIFT"            "+shift_build"
bind "ALT"              "+alt_destroy"

bind "1"                "slot1"
bind "2"                "slot2"
bind "3"                "slot3"
bind "4"                "slot4"

echo "==================================="
echo "       ENGINEER CONFIG LOADED      "
echo "==================================="

