// ==========================================================
// SCOUT CONFIG
// ==========================================================
exec "_my_configs/reset.cfg"

// ----------------------------------------------------------
//  QUICK-THROW UTILITY (Cleaver / Milk)
// ----------------------------------------------------------
// Switches to Slot 2, throws, and returns to previous weapon
alias +quickutil       "slot2; +attack"
alias -quickutil       "-attack; lastinv"

// ----------------------------------------------------------
//  SCOUT BINDS
// ----------------------------------------------------------
bind "SHIFT"           "+quickutil"

echo "==================================="
echo "         SCOUT CONFIG LOADED       "
echo "==================================="

