// medic.cfg
exec _my_configs/reset.cfg

// Medic Radar
alias autocall_initial "hud_medicautocallersthreshold 80"
alias autocall_temp    "hud_medicautocallersthreshold 150"
alias +radar           "autocall_temp"
alias -radar           "autocall_initial"
bind "g" "+radar"

// Medic Specific Logic
alias maskuber "voicemenu 0 0; say_team ==== UBER READY! ===="
alias fakeuber "voicemenu 1 7; say_team ==== FAKED UBER! ===="

// Enhanced Uber Pop
alias +charge "slot2; dropitem; +attack2; say_team "==== UBER POPPED! ===="; voicemenu 0 0"
alias -charge "-attack2"
bind "mouse2" "+charge"

// Forward Spawn (The F1 Toggle)
alias forwardspawn_random "join_class random; alias forwardspawn_toggle forwardspawn_medic"
alias forwardspawn_medic  "join_class medic;  alias forwardspawn_toggle forwardspawn_random; say_team "==== MOVED SPAWN ===="
alias forwardspawn_toggle "forwardspawn_random"
bind "F1" "forwardspawn_toggle"

// --- Medic Binds ---
bind "e" "maskuber"      // Masking
bind "x" "fakeuber"      // Faking
bind "r" "call_thanks"   // Thanks!
bind "z" "call_spy"      // Spy!
bind "f" "call_sentry"   // Sentry!
bind "c" "call_push"     // PUSH UP!

echo "==================================="
echo "       MEDIC CONFIG LOADED         "
echo "==================================="

