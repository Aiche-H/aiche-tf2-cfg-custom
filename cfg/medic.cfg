// ==========================================================
// MEDIC CONFIG
// ==========================================================
exec "_my_configs/reset.cfg"

// ----------------------------------------------------------
//  MEDIC RADAR (See Teammates Through Walls)
// ----------------------------------------------------------
alias "autocall_initial" "hud_medicautocallersthreshold 50"
alias "autocall_temp"    "hud_medicautocallersthreshold 150"

alias +radar             "autocall_temp"
alias -radar             "autocall_initial"

// ----------------------------------------------------------
//  UBER & COMBAT LOGIC
// ----------------------------------------------------------
// Masking: Calls "Medic!" to hide the "I am fully charged!" voice line
alias "maskuber"         "voicemenu 0 0; say_team ==== UBER READY! ===="

// Faking: Calls "Uber Charge Ready!" to trick the enemy into retreating
alias "fakeuber"         "voicemenu 1 7; say_team ==== FAKED UBER! ===="

// Enhanced Uber Pop: Drops Intel/Pass Time ball and activates Uber
alias +charge            "slot2; dropitem; +attack2; say_team ==== UBER POPPED! ===="
alias -charge            "-attack2"

// ----------------------------------------------------------
//  MEDIC BINDS
// ----------------------------------------------------------
bind "SHIFT"             "+radar"
bind "MOUSE2"            "+charge"

bind "e"                 "maskuber"      // Masking
bind "x"                 "fakeuber"      // Faking
bind "r"                 "call_thanks"   // Thanks!
bind "z"                 "call_spy"      // Spy!
bind "f"                 "call_sentry"   // Sentry!
bind "c"                 "call_push"     // PUSH UP!

echo "==================================="
echo "       MEDIC CONFIG LOADED         "
echo "==================================="

