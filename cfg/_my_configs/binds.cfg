// ==========================================================
//  KEYBINDS
// ==========================================================
echo "[Binds] Loading Keybinds..."

// ----------------------------------------------------------
//  UNBIND EVERYTHING
// ----------------------------------------------------------
unbindall

// ----------------------------------------------------------
//  MOUSE & INPUT
// ----------------------------------------------------------
m_rawinput                  1     // Direct input from mouse (ignores Windows accel)
m_filter                    0     // No mouse smoothing
m_customaccel               0
m_mouseaccel1               0
m_mouseaccel2               0
sensitivity                 1.75    //DPI 800 soldier and demo higher sniper slower
zoom_sensitivity_ratio      "0.833333" // Consistent 1:1 feel while scoped

// ----------------------------------------------------------
//  CROSSHAIR & COMBAT HUD (different on sniper)
// ----------------------------------------------------------
cl_crosshair_file           "crosshair3"
cl_crosshair_scale          "25"
cl_crosshair_red            "255"
cl_crosshair_green          "0"
cl_crosshair_blue           "255"

// ----------------------------------------------------------
//  MOVEMENT & CORE CONTROLS
// ----------------------------------------------------------
bind "w"         "+mfwd"
bind "s"         "+mback"
bind "a"         "+mleft"
bind "d"         "+mright"
bind "SPACE"     "+superjump"
bind "CTRL"      "+superduck"

// ----------------------------------------------------------
//  COMBAT & WEAPON SLOTS
// ----------------------------------------------------------
bind "MOUSE1"    "+attack"
bind "MOUSE2"    "+attack2"
bind "MOUSE3"    "+attack3"
bind "v"         "+quick_melee"
bind "q"         "lastinv"
bind "t"         "+use_action_slot_item"
bind "h"         "dropitem"
bind "1"         "slot1"
bind "2"         "slot2"
bind "3"         "slot3"
bind "4"         "slot4"
bind "5"         "slot5"
bind "6"         "slot6"
bind "7"         "slot7"
bind "8"         "slot8"
bind "9"         "slot9"
bind "0"         "slot10"

// ----------------------------------------------------------
//  COMMUNICATION (Voice & Chat)
// ----------------------------------------------------------
bind "CAPSLOCK"  "+voicerecord"
bind "ENTER"     "say"
bind "p"         "say_team"
bind "g"         "+taunt"

// Voice Menu Shortcuts
bind "e"         "call_medic"
bind "r"         "call_thanks"
bind "z"         "call_spy"
bind "f"         "call_sentry"
bind "c"         "call_push"
bind "x"         "call_uber"

// ----------------------------------------------------------
//  LOADOUTS & CLASS SELECTION
// ----------------------------------------------------------
bind "F1"        "load_itempreset 0"
bind "F2"        "load_itempreset 1"
bind "F3"        "load_itempreset 2"
bind "F4"        "load_itempreset 3"

bind ","         "changeclass"
bind "."         "open_charinfo_direct"
bind "/"         "changeteam"

// ----------------------------------------------------------
//  SYSTEM, UI & UTILITY
// ----------------------------------------------------------
bind "F6"        "ds_record"
bind "F7"        "ds_mark"
bind "F8"        "ds_stop"
bind "F9"        "screenshot"
bind "F10"       "toggle r_drawviewmodel 0 1"
bind "F11"       "toggle cl_hud_minmode 0 1"
bind "F12"       "fix_game"

bind "k"         "kill"
bind "n"         "cl_decline_first_notification"
bind "y"         "cl_trigger_first_notification"
bind "TAB"       "+scoreboard"
bind "ESCAPE"    "cancelselect"
bind "SEMICOLON" "toggleconsole"

echo "[Binds] Done!"
