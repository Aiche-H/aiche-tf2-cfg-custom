//---------
// Keybinds
//---------
echo "[Binds] Loading Keybinds..."

unbindall

// Apply Binds
bind w +mfwd
bind s +mback
bind a +mleft
bind d +mright
bind SPACE "+superjump"
bind CTRL "+superduck"

// Combat & Slots
bind "0" "slot10"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "+attack3"
bind "v" "+quick_melee"
bind "q" "lastinv"
bind "h" "+use_action_slot_item"

// Communication & UI
bind "t" "+taunt"
bind "n" "cl_decline_first_notification"
bind "p" "say_team"
bind "j" "dropitem" // Drop the Intel / Jack / Pass Time ball
bind "y" "cl_trigger_first_notification"
bind "ENTER" "say"
bind "," "open_charinfo_direct"
bind "." "changeclass"
bind "/" "changeteam"
bind "CAPSLOCK" "+voicerecord"
bind "TAB" "+scoreboard"
bind "ESCAPE" "cancelselect"
bind "SEMICOLON" "toggleconsole"
bind "e" "call_medic"    // Medic!
bind "r" "call_thanks"   // Thanks!
bind "z" "call_spy"      // SPY! (With Chat)
bind "f" "call_sentry"   // SENTRY! (With Chat)
bind "c" "call_push"     // PUSH UP! (With Chat)
bind "x" "call_uber"     // POP IT! (With Chat)


// Function Keys & Misc
bind "F2" "show_quest_log"
bind "F3" "show_matchmaking"
bind "F6" "save_replay"
bind "F7" "abuse_report_queue"
bind "F8" "fix_game"
bind "F9" "vr_toggle"
bind "F11" "vr_reset_home_pos"
bind "F12" "replay_togglereplaytips"
bind "k" "kill"
bind "-" "graphtoggle"
bind "INS" "+klook"
bind "END" "centerview"
bind "PAUSE" "pause"

echo "[Binds] Done!"
