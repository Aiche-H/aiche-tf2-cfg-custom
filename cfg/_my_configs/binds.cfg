// ==========================================================
//  KEYBINDS
// ==========================================================
echo "[Binds] Loading Keybinds..."

// ==========================================================
//  UNBIND EVERYTHING
// ==========================================================
unbindall

// ==========================================================
//  MOVEMENT & CORE CONTROLS
// ==========================================================
bind "w"         "+mfwd"
bind "s"         "+mback"
bind "a"         "+mleft"
bind "d"         "+mright"
bind "SPACE"     "+superjump"
bind "CTRL"      "+superduck"
bind "TAB"       "+scoreboard"
bind "ESCAPE"    "cancelselect"

// ==========================================================
//  COMBAT & WEAPON SLOTS
// ==========================================================
bind "MOUSE1"    "+attack"
bind "MOUSE2"    "+attack2"
bind "MOUSE3"    "+attack3"
bind "v"         "+quick_melee"
bind "q"         "lastinv"
bind "t"         "+use_action_slot_item"
bind "h"         "dropitem"
bind "1"         "slot1"
bind "2"         "slot2"
bind "3"         "slot3"
bind "4"         "slot4"
bind "5"         "slot5"
bind "6"         "slot6"
bind "7"         "slot7"
bind "8"         "slot8"
bind "9"         "slot9"
bind "0"         "slot10"

// ==========================================================
//  COMMUNICATION (Voice & Chat)
// ==========================================================
bind "CAPSLOCK"  "+voicerecord"
bind "ENTER"     "say"
bind "p"         "say_team"
bind "g"         "+taunt"

// Voice Menu Shortcuts
bind "e"         "call_medic"
bind "r"         "call_thanks"
bind "z"         "call_spy"
bind "f"         "call_sentry"
bind "c"         "call_push"
bind "x"         "call_uber"

// ==========================================================
//  LOADOUTS & CLASS SELECTION
// ==========================================================
bind "F1"        "load_itempreset 0"
bind "F2"        "load_itempreset 1"
bind "F3"        "load_itempreset 2"
bind "F4"        "load_itempreset 3"

bind "."         "open_charinfo_direct"
bind ","         "changeclass"
bind "/"         "changeteam"

// ==========================================================
//  SYSTEM, UI & UTILITY
// ==========================================================
bind "F5"        "show_matchmaking"
bind "F6"        "graphtoggle"
bind "F7"        "fix_game"
bind "F8"        "kill"
bind "F9"        "show_quest_log"

bind "n"         "cl_decline_first_notification"
bind "y"         "cl_trigger_first_notification"
bind "SEMICOLON" "toggleconsole"

echo "[Binds] Done!"
