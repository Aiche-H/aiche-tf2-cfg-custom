// ---------------
// graphics
// ---------------
echo "[Graphics] Loading visuals..."

// These settings will take advantage of CPU multi-threading
r_threaded_particles 1
mat_queue_mode 2
studio_queue_mode 1
host_thread_mode 0

// These settings will take advantage of the material system, depending on how mat_queue_mode is set
r_queued_decals 0
r_queued_post_processing 0
r_queued_ropes 1

// Controls the quality of objects based on distance
r_lod -1
lod_TransitionDist -5000
mat_max_worldmesh_vertices 65536

// Controls weapon and other miscellaneous effects
cl_ejectbrass 0
muzzleflash_light 0
cl_muzzleflash_dlight_1st 0
tracer_extra 0
r_drawtracers_firstperson 0
cl_show_splashes 0
cl_fasttempentcollision 20

// Particle effects
tf_particles_disable_weather 1
mat_reduceparticles 1
cl_new_impact_effects 0
r_drawflecks 0
r_particle_sim_spike_threshold_ms 0

// Disables motion blur
mat_motion_blur_enabled 0

// These settings will adjust the characters in the game
r_flex 0                    // Facial muscle calculations
flex_rules 0                // Expression rules
anim_3wayblend 0            // Complex animation blending
// r_teeth 0                // Teeth rendering - Uncomment to disable
// r_eyes 0                 // Eye rendering - Uncomment to disable
// r_eyemove 0              // Eye movement - Uncomment to disable
// r_glint_procedural 0     // Eye glint effect - Uncomment to disable
// tf_clientsideeye_lookats 0 // Client-side eye tracking - Uncomment to disable// --------------

// Bullet holes and overall decal support
r_decals 0
mp_decals 0
r_drawbatchdecals 1
r_decal_cover_count 1
r_decal_overlap_area 0.4
r_decal_overlap_count 0

// Blood on hurt players and some bullet decals on props
r_drawmodeldecals 0

// Decals placed by the map author
r_renderoverlayfragment 0
r_overlayfadeenable 1
r_overlayfademax 2000
r_overlayfademin 1750

// Various small objects
r_decalstaticprops 0
r_drawdetailprops 0
r_staticprop_lod 7
r_PhysPropStaticLighting 1

// General/overall graphics settings
mat_viewportscale 1
mat_viewportupscale 1
r_3dsky 0
r_dopixelvisibility 1
r_drawpixelvisibility 0
r_pixelvisibility_partial 0

// Ropes for Mannpower grappling hook and as decoration in maps
r_drawropes 0

// Optimize visuals without noticeable effects to the user
mat_vsync 0
engine_no_focus_sleep 0
r_fastzreject 1
r_entityclips 1
disp_dynamic 0
r_hunkalloclightmaps 1
r_frustumcullworld 1
r_worldlistcache 1
mat_clipz 1
mat_use_compressed_hdr_textures 1
r_occlusion 1
r_occludeemaxarea 1
r_occluderminarea 10
mat_tonemapping_occlusion_use_stencil 0
host_flush_threshold 0
r_norefresh 1
fast_fogvolume 1
r_pixelfog 0
mat_compressedtextures 1
mat_mipmaptextures 1
nb_shadow_dist 0
cl_ShowBoneSetupEnts 0
sv_alternateticks 0
mod_offline_hdr_switch 1

// Adjustments to memory allocation
mem_max_heapsize_dedicated 128
mem_max_heapsize 320
lzma_persistent_buffer 1
cl_always_flush_models 0
mat_levelflush 1
sv_forcepreload 0
mat_bufferprimitives 1

// Set buffer and file read sizes
filesystem_buffer_size 8192
filesystem_max_stdio_read 31

// Set up filesystem parameters
filesystem_native 1
filesystem_unbuffered_io 1

// Control loading and caching models
mod_load_anims_async 1
mod_load_mesh_async 1
mod_load_vcollide_async 0
mod_lock_mdls_on_load 0
mod_forcetouchdata 1
mod_touchalldata 1
mod_forcedata 1

// Remove Ragdolls
cl_ragdoll_fade_time 0
cl_ragdoll_forcefade 1
cl_ragdoll_physics_enable 0
g_ragdoll_fadespeed 0
g_ragdoll_lvfadespeed 0
ragdoll_sleepaftertime 0

// Remove Gibs
cl_phys_props_enable 0
cl_phys_props_max 0
props_break_max_pieces 0
r_propsmaxdist 1
violence_agibs 0
violence_hgibs 0

echo "[Graphics] Done!"
