// ---------
// Sounds
// ---------
// Sound volume
echo "[Sound] Loading sound settings..."

// General
snd_musicvolume "0.0"
snd_surround_speakers "2"

// Mutes all text and voice chat when you mute someone
cl_mute_all_comms 1

// Hitsounds (Standard)
tf_dingalingaling 1
tf_dingaling_volume 1.0000
tf_dingaling_pitchmindmg 100
tf_dingaling_pitchmaxdmg 100

// Last Hit (Kill Sound)
tf_dingalingaling_lasthit 1
tf_dingaling_lasthit_volume 1.0000
tf_dingaling_lasthit_pitchmindmg 100
tf_dingaling_lasthit_pitchmaxdmg 100

// Threading options to take advantage of modern CPUs for the sound system
snd_async_fullyasync 1
snd_async_minsize 0
snd_mix_async 1
phonemedelay 0

// Misc sound settings
snd_delay_sound_shift 0.01
snd_mixahead 0.066

// Optimizations with no noticeable effect on the listener
snd_cull_duplicates 0
voice_steal 2
voice_buffer_ms 200
snd_async_spew_blocking 0
dsp_enhance_stereo 0
snd_defer_trace 1
snd_noextraupdate 1

echo "[Sound] Done!"

