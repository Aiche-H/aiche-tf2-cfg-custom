// ==========================================================
// SOUND & AUDIO PERFORMANCE
// ==========================================================
echo "[Sound] Loading sound settings..."

// ----------------------------------------------------------
//  GENERAL VOLUME & COMMUNICATION
// ----------------------------------------------------------
snd_surround_speakers       "2"     // Standard 2-speaker/Headphone setup
cl_mute_all_comms           1       // Muting a player mutes their text too

// ----------------------------------------------------------
//  COMBAT AUDIO (Hitsounds & Killsounds)
// ----------------------------------------------------------
// Standard Hitsound
tf_dingalingaling           1
tf_dingaling_volume         1.0000
tf_dingaling_pitchmindmg    100
tf_dingaling_pitchmaxdmg    100

// Last Hit (Killsound)
tf_dingalingaling_lasthit   1
tf_dingaling_lasthit_volume 1.0000
tf_dingaling_lasthit_pitchmindmg 100
tf_dingaling_lasthit_pitchmaxdmg 100

// ----------------------------------------------------------
//  ENGINE THREADING & LATENCY
// ----------------------------------------------------------
// Threading options for modern CPUs
snd_async_fullyasync        1
snd_async_minsize           0
snd_mix_async               1
phonemedelay                0

// Sound Latency (lower is snappier, but can crackle on old CPUs)
snd_delay_sound_shift       0.01
snd_mixahead                0.066

// ----------------------------------------------------------
//  AUDIO OPTIMIZATIONS
// ----------------------------------------------------------
snd_cull_duplicates         0
voice_steal                 2
voice_buffer_ms             200
snd_async_spew_blocking     0
dsp_enhance_stereo          0
snd_defer_trace             1
snd_noextraupdate           1

echo "[Sound] Done!"
