// _my_config/scripts.cfg
echo "[Scripts] Loading scripts...

// Core Logic (Define once)
alias none ""

// Movement Aliases (Null-cancelling WASD)
alias +mfwd "-back;+forward;alias checkfwd +forward;"
alias +mback "-forward;+back;alias checkback +back;"
alias +mleft "-moveright;+moveleft;alias checkleft +moveleft;"
alias +mright "-moveleft;+moveright;alias checkright +moveright;"
alias -mfwd "-forward;checkback;alias checkfwd none;"
alias -mback "-back;checkfwd;alias checkback none;"
alias -mleft "-moveleft;checkright;alias checkleft none;"
alias -mright "-moveright;checkleft;alias checkright none;"
alias checkfwd none
alias checkback none
alias checkleft none
alias checkright none

// --- Reliable Crouch-Jump & Duck Logic ---

// 1. The Crouch-Jump (Space)
// This handles the jumping and ducking together perfectly.
alias +superjump "+jump; +duck"
alias -superjump "-jump; -duck"

// 2. The Manual Duck (Ctrl)
// This is for when you just want to crouch without jumping.
alias +superduck "+duck"
alias -superduck "-duck"

// Tactical Shotcalling Aliases
alias call_spy      "voicemenu 1 1; say_team ==== SPY! BE AWARE! ===="
alias call_sentry   "voicemenu 1 2; say_team ==== SENTRY AHEAD! ===="
alias call_push     "voicemenu 2 1; say_team ==== PUSH UP! ===="
alias call_uber     "voicemenu 1 6; say_team ==== USE UBER! ===="
alias call_thanks   "voicemenu 0 1"
alias call_medic    "voicemenu 0 0"

// Quick-Melee Alias
alias +quick_melee  "slot3; +attack"
alias -quick_melee  "-attack; lastinv"

// The "Panic Fix" Button
alias "fix_game" "record fix; stop; snd_restart; hud_reloadscheme"

// Better scoreboard
alias +scoreboard "+showscores ; net_graph 1 ; cl_showfps 2"
alias -scoreboard "-showscores ; net_graph 0 ; cl_showfps 0"

echo "[Scripts] Done!"

