// _my_configs/reset.cfg
echo "[Reset] Cleaning up class modifiers and restoring master binds..."

// 1. kill class-specific modifiers
unbindall

// 2. Safety Clears (Always good to have!)
-attack
-attack2
-forward
-back
-moveleft
-moveright

// 3. RE-APPLY MASTER BINDS (FIXED PATH)
exec _my_configs/binds.cfg

// 4. reset class-specific engine settings
hud_medicautocallersthreshold 80
cl_autoreload 1

// --- restore tactical aliases ---
alias call_spy      "voicemenu 1 1; say_team ==== SPY! BE AWARE! ===="
alias call_sentry   "voicemenu 1 2; say_team ==== SENTRY AHEAD! ===="
alias call_push     "voicemenu 2 1; say_team ==== PUSH UP! ===="
alias call_uber     "voicemenu 1 6; say_team ==== USE UBER! ===="
alias call_thanks   "voicemenu 0 1"
alias call_medic    "voicemenu 0 0"

echo "[Reset] Done!"
