// ==========================================================
// NETWORKING & CONNECTION
// ==========================================================
echo "[Network] Loading network settings..."

// ----------------------------------------------------------
//  CORE RATES (66 Tick Optimized)
// ----------------------------------------------------------
cl_cmdrate                  66
cl_updaterate               66
rate                        196608

// Interpolation (Determines how the game "smooths" player movement)
cl_interp                   0      // Set to 0 to let cl_interp_ratio handle it
cl_interp_ratio             1      // Low interp for hitscan (Scout/Sniper/Spy)
cl_lagcompensation          1
cl_pred_optimize            2
cl_predictweapons           1

// Smoothness (Disabling for raw packet accuracy)
cl_smooth                   0
cl_smoothtime               0.01
hud_escort_interp           0.1

// ----------------------------------------------------------
//  PACKETS & THREADING
// ----------------------------------------------------------
net_queued_packet_thread    1      // Handle packets on a separate CPU thread
net_maxpacketdrop           1000
net_splitrate               1
net_compresspackets         1
net_compresspackets_minsize 957
net_maxroutable             1200
net_maxfragments            1200

// Packet Timing & Overflow Prevention
net_splitpacket_maxrate     78643
net_maxcleartime            0.0081889

// ----------------------------------------------------------
//  FILE HANDLING & DOWNLOADS
// ----------------------------------------------------------
net_maxfilesize             64     // Max size of files (maps/sprays) you can download
cl_downloadfilter           "mapsonly" // Blocks annoying server sounds/decals
tf_steam_workshop_query_timeout 5

// ----------------------------------------------------------
//  MATCHMAKING & PARTY
// ----------------------------------------------------------
tf_mm_custom_ping           100    // Prefer servers under 100ms
tf_mm_custom_ping_enabled   1
tf_mm_debug_level           0
tf_party_join_request_mode  1
tf_party_keep_on_same_team  1

echo "[Network] Done!"
