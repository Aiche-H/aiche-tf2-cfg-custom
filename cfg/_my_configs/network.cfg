// ---------------
// Networking
// ---------------
echo "[Network] Loading network settings..."

// Optimizes for better networking

net_queued_packet_thread 1
net_maxpacketdrop 1000
net_splitrate 1
cl_pred_optimize 2
cl_lagcompensation 1
cl_predictweapons 1
cl_smooth 0
cl_smoothtime 0.01
hud_escort_interp 0.1

// -------------------
// '-- Packet Size --'
// -------------------
// How big packets are and how they are split up/compressed

net_compresspackets 1
net_compresspackets_minsize 957
net_maxroutable 1200;net_maxfragments 1200

// -------------------
// '-- Upload Rate --'
// -------------------
// Speed of packet sending, rate limited to prevent packet overflow

rate 196608
net_splitpacket_maxrate 78643
net_maxcleartime 0.0081889

// -------------
// '-- Files --'
// -------------
// Controls networked file handling

net_maxfilesize 64
cl_downloadfilter mapsonly
tf_steam_workshop_query_timeout 5

// -------------------
// '-- Matchmaking --'
// -------------------
// Adjusts casual/competitive matchmaking settings

tf_mm_custom_ping 100
tf_mm_custom_ping_enabled 1
tf_mm_debug_level 0
tf_party_join_request_mode 1
tf_party_keep_on_same_team 1

cl_updaterate 66
cl_cmdrate 66
rate 196608

cl_interp 0
cl_interp_ratio 1

echo "[Network] Done!"
