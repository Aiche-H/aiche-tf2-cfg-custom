// autoexec.cfg
// =================================================================
// [ USER INSTRUCTIONS: STEAM LAUNCH OPTIONS ]
// =================================================================
// For this config to work perfectly, right-click TF2 in Steam ->
// Properties -> Launch Options and paste the following:
//
// GENERAL (Performance & FX):
// -novid -nojoy -nosteamcontroller -nohltv -preload -console
// -particles 1 -softparticlesdefaultoff
//
// EXTRA (Linux / Steam Deck):
// gamemoderun %command% -vulkan
//
// EXTRA (Windows Performance):
// -dxlevel 81
//
// NOTE: Set your resolution manually in launch options if needed:
// -full -w 1920 -h 1080
//
// -----------------------------------------------------------------
// [ IMPORTANT PARTICLE NOTE ]
// -----------------------------------------------------------------
// If you are NOT using an "Invisible Explosion / Muzzle Flash" mod,
// '-particles 1' may cause default explosions to look glitchy/square.
//
// FIX: Change '-particles 1' to '-particles 512' in launch options.
// =================================================================
clear
echo "==================================="
echo "    RELOADING CUSTOM CONFIGS...    "
echo "==================================="

sv_cheats 1
sv_forcepreload 1

// Load the Logic & Scripts
exec _my_configs/scripts.cfg

// Force a "Clean Slate" & Load Master Binds
// (This runs reset.cfg, which internally execs binds.cfg)
exec _my_configs/reset.cfg

// Load the Engine Settings
exec _my_configs/network.cfg
exec _my_configs/graphics.cfg
exec _my_configs/misc.cfg

echo "==================================="
echo "    ALL CONFIGS LOADED SUCCESSFULLY"
echo "==================================="
