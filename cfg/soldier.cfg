// ==========================================================
// SOLDIER CONFIG
// ==========================================================
exec "_my_configs/reset.cfg"

// ----------------------------------------------------------
//  FASTER SENSITIVITY THAN BASE
// ----------------------------------------------------------
sensitivity     2.00

// ----------------------------------------------------------
//  QUICK-BANNER UTILITY (Buff / Backup / Conch)
// ----------------------------------------------------------
// Switches to Slot 2, activates banner, and returns to primary
alias +banner          "slot2; +attack"
alias -banner          "-attack; lastinv"

// ----------------------------------------------------------
//  SOLDIER BINDS
// ----------------------------------------------------------
bind "SHIFT"           "+banner"

echo "==================================="
echo "       SOLDIER CONFIG LOADED       "
echo "==================================="

