// spy.cfg
exec _my_configs/reset.cfg

// Cloak & Combat
// V is Cloak, MOUSE2 is Stab+AutoDisguise, MOUSE1 is Clean Shot
bind "v" "+attack2"

// Attack  and lastdisguise in one click
alias +stab_disguise "+attack; spec_next"
alias -stab_disguise "-attack; lastdisguise"

bind "MOUSE2" "+stab_disguise"
bind "MOUSE1" "+attack"

// Disguise Aliases (Following Menu Order)
alias d_scout    "disguise 1 -1" // Menu 1
alias d_solly    "disguise 3 -1" // Menu 2
alias d_pyro     "disguise 7 -1" // Menu 3
alias d_demo     "disguise 4 -1" // Menu 4
alias d_heavy    "disguise 6 -1" // Menu 6
alias d_engie    "disguise 9 -1" // Menu 7
alias d_sniper   "disguise 2 -1" // Menu 8
alias d_spy      "disguise 8 -1" // Menu 9

// Modifier Logic (Shift 1-4 | Alt 1-4)
// SHIFT: First 4 Classes
alias +shift_dis "bind 1 d_scout; bind 2 d_solly; bind 3 d_pyro; bind 4 d_demo"
alias -shift_dis "bind 1 slot1;   bind 2 slot2;   bind 3 slot3; bind 4 slot4"

// ALT: Last 4 Classes (Skipping Medic)
alias +alt_dis   "bind 1 d_heavy; bind 2 d_engie; bind 3 d_sniper; bind 4 d_spy"
alias -alt_dis   "bind 1 slot1;   bind 2 slot2;   bind 3 slot3;    bind 4 slot4"

// 4. Apply Binds
bind "SHIFT" "+shift_dis"
bind "ALT"   "+alt_dis"
bind "b"     "lastdisguise"

echo "==================================="
echo "        SPY CONFIG LOADED          "
echo "==================================="

