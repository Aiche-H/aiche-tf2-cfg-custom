// ==========================================================
//  SPY CONFIG
// ==========================================================
exec "_my_configs/reset.cfg"

// ----------------------------------------------------------
//  DISGUISE ALIASES (Menu Order)
// ----------------------------------------------------------
alias "d_scout"        "disguise 1 -1"
alias "d_solly"        "disguise 3 -1"
alias "d_pyro"         "disguise 7 -1"
alias "d_demo"         "disguise 4 -1"
alias "d_heavy"        "disguise 6 -1"
alias "d_engie"        "disguise 9 -1"
alias "d_sniper"       "disguise 2 -1"
alias "d_spy"          "disguise 8 -1"

// ----------------------------------------------------------
//  COMBAT & CLOAK LOGIC
// ----------------------------------------------------------
// Stab + Auto-Disguise: Attacks and then reapplies last disguise on release
alias +stab_disguise   "+attack; spec_next"
alias -stab_disguise   "-attack; lastdisguise"

// Modifier Logic: SHIFT (Classes 1-4) | ALT (Classes 5-9)
alias +shift_dis       "bind 1 d_scout; bind 2 d_solly; bind 3 d_pyro; bind 4 d_demo"
alias -shift_dis       "bind 1 slot1;   bind 2 slot2;   bind 3 slot3; bind 4 slot4"

alias +alt_dis         "bind 1 d_heavy; bind 2 d_engie; bind 3 d_sniper; bind 4 d_spy"
alias -alt_dis         "bind 1 slot1;   bind 2 slot2;   bind 3 slot3;  bind 4 slot4"

// ----------------------------------------------------------
//  SPY BINDS
// ----------------------------------------------------------
bind "MOUSE1"          "+attack"
bind "MOUSE2"          "+stab_disguise"
bind "v"               "+attack2"
bind "b"               "lastdisguise"

bind "SHIFT"           "+shift_dis"
bind "ALT"             "+alt_dis"

echo "==================================="
echo "          SPY CONFIG LOADED        "
echo "==================================="
