// ==========================================================
// HEAVYWEAPONS CONFIG
// ==========================================================
exec "_my_configs/reset.cfg"

// ----------------------------------------------------------
//  LUNCHBOX UTILITY (Drop Sandvich/Food)
// ----------------------------------------------------------
// Switches to Slot 2, Drops Food (Alt-Fire), and Alerts Team
alias +lunchtime       "slot2; +attack2"
alias -lunchtime       "-attack2; lastinv"

// ----------------------------------------------------------
//  HEAVY BINDS
// ----------------------------------------------------------
bind "SHIFT"           "+lunchtime"

echo "==================================="
echo "     HEAVYWEAPONS CONFIG LOADED    "
echo "==================================="

