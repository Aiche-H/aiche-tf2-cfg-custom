// ==========================================================
// DEMOKNIGHT CONFIG
// ==========================================================
exec "_my_configs/reset.cfg"


// ----------------------------------------------------------
//  FASTER SENSITIVITY THAN BASE
// ----------------------------------------------------------
sensitivity     2.00

// ----------------------------------------------------------
//  ENGINE SETTINGS
// ----------------------------------------------------------
cl_yawspeed 210

// ----------------------------------------------------------
//  THE JUMP-CHARGE (Trimping Engine)
// ----------------------------------------------------------
// Syncs the Jump + Charge (+attack2) and turns on the steering
alias "+charge_jump" "+jump; +attack2"
alias "-charge_jump" "-jump; -attack2"

// ----------------------------------------------------------
//  APPLY BINDS
// ----------------------------------------------------------
bind "MOUSE3" "+charge_jump"
bind "m"      "toggle cl_yawspeed 150 210 280"
bind "q"      "+left"
bind "e"      "+right"
bind "F5"     "exec demoman"
bind "v"      "call_medic"

echo "==================================="
echo "     DEMOKNIGHT CONFIG LOADED      "
echo "    PRESS [F5] FOR DEMOMAN MODE    "
echo "==================================="

